<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Circular Border -->
  <circle cx="150" cy="150" r="130" stroke="#0B3D91" stroke-width="6" fill="none"/>

  <!-- House -->
  <polygon points="120,90 150,60 180,90" fill="#0B3D91"/>
  <rect x="125" y="90" width="50" height="40" fill="#FFD700"/>
  <rect x="145" y="105" width="10" height="15" fill="#0B3D91"/>

  <!-- Leaves -->
  <ellipse cx="135" cy="70" rx="10" ry="20" fill="#2E7D32"/>
  <ellipse cx="165" cy="70" rx="10" ry="20" fill="#2E7D32"/>

  <!-- Handshake -->
  <path d="M80 170 Q120 140 150 170 Q180 200 220 170 L220 200 Q180 230 150 200 Q120 170 80 200 Z"
        fill="#FFD700"/>

  <path d="M80 170 Q120 200 150 170 Q180 140 220 170 L220 150 Q180 120 150 150 Q120 180 80 150 Z"
        fill="#0B3D91"/>

  <!-- Stars (Development/Growth) -->
  <polygon points="150,40 155,50 145,50" fill="#FFD700"/>
  <polygon points="170,50 175,60 165,60" fill="#FFD700"/>
  <polygon points="130,50 135,60 125,60" fill="#FFD700"/>

  <!-- Text -->
  <text x="150" y="260" font-size="22" font-weight="bold" text-anchor="middle" fill="#0B3D91">
    VillageSathi
  </text>

</svg>