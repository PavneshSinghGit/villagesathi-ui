<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" height="12">
  <!-- Saffron -->
  <rect width="300" height="66.66" y="0" fill="#FF9933"/>
  
  <!-- White -->
  <rect width="300" height="66.66" y="66.66" fill="#FFFFFF"/>
  
  <!-- Green -->
  <rect width="300" height="66.66" y="133.33" fill="#138808"/>

  <!-- Ashoka Chakra -->
  <circle cx="150" cy="100" r="20" fill="none" stroke="#000080" stroke-width="2"/>

  <!-- 24 spokes -->
  <g stroke="#000080" stroke-width="1">
    <line x1="150" y1="100" x2="150" y2="80"/>
    <line x1="150" y1="100" x2="160" y2="82"/>
    <line x1="150" y1="100" x2="170" y2="90"/>
    <line x1="150" y1="100" x2="170" y2="100"/>
    <line x1="150" y1="100" x2="170" y2="110"/>
    <line x1="150" y1="100" x2="160" y2="118"/>
    <line x1="150" y1="100" x2="150" y2="120"/>
    <line x1="150" y1="100" x2="140" y2="118"/>
    <line x1="150" y1="100" x2="130" y2="110"/>
    <line x1="150" y1="100" x2="130" y2="100"/>
    <line x1="150" y1="100" x2="130" y2="90"/>
    <line x1="150" y1="100" x2="140" y2="82"/>
    
    <!-- extra spokes for density -->
    <line x1="150" y1="100" x2="155" y2="80"/>
    <line x1="150" y1="100" x2="165" y2="85"/>
    <line x1="150" y1="100" x2="175" y2="95"/>
    <line x1="150" y1="100" x2="175" y2="105"/>
    <line x1="150" y1="100" x2="165" y2="115"/>
    <line x1="150" y1="100" x2="155" y2="120"/>
    <line x1="150" y1="100" x2="145" y2="120"/>
    <line x1="150" y1="100" x2="135" y2="115"/>
    <line x1="150" y1="100" x2="125" y2="105"/>
    <line x1="150" y1="100" x2="125" y2="95"/>
    <line x1="150" y1="100" x2="135" y2="85"/>
    <line x1="150" y1="100" x2="145" y2="80"/>
  </g>
</svg>